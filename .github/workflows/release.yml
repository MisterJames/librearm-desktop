name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $rawVersion = "${{ inputs.version }}"
          } else {
            $rawVersion = "${{ github.ref_name }}"
          }

          $version = $rawVersion.TrimStart("v")
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Build release artifacts
        shell: pwsh
        run: |
          .\scripts\build-release.ps1 `
            -Configuration Release `
            -Version "${{ steps.version.outputs.value }}" `
            -RuntimeIdentifier win-x64, win-arm64, win-x86

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LibreArm-${{ steps.version.outputs.value }}
          path: artifacts/release/*.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: artifacts/release/*.zip
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease }}
